  双周赛四题依次按频率与数值排序、按横坐标寻找最宽空白竖带、暴力统计恰好相差一个字符的子串，以及用按列字符频数和记忆化 DP 计算组成目标串的方案；第三题曾把暴力想复杂并超时两次。
