    composition: >-
      不使用 Forest。绘制横向四站无字算法物流中心：箱子按每箱单位密度从高到低排队，容量有限的无标志货车优先装高密度箱；食物形筹码与先前筹码配对，只有总重量落入逐级倍增托盘的组合被计数；一条正数珠链由两道可滑动闸门切成三段，前缀重量轨道保持左段不超过中段、中段不超过右段并累计可行位置；目标槽位先映射为唯一的相对次序，来自另一条珠链的匹配珠进入编号架后由上升轨道保留最长递增序列，空缺数就是所需插入。禁止人物、字符、字母、数字、公式、代码、箭头、可读文字、品牌车辆、真实食品标志、假界面、商标或水印。
