    composition: >-
      不使用 Forest。绘制横向四联无字算法工坊：左侧传送带依次穿过四道只能向前的取珠闸门，被选中的四颗珠子汇入平衡托盘，强调下标顺序；中左盾牌与长矛组成的角色令牌先按长矛高度递减、相同高度时盾牌递增排列，扫描尺只把同时被前方更强令牌压过的移入弱者篮；中右连续房间由单向前门和回返点相连，奇数次到达会沿回廊退到旧房间，偶数次才前进一步，折叠动态规划轨道复用此前路程；右侧无字数值石块按质因数齿轮连接到并查集枢纽，再与排序后的槽位逐一核对。禁止人物、字符、字母、数字、公式、代码、可读文字、箭头、游戏品牌、商标或水印。
