    composition: >-
      不使用 Forest。绘制横向四站无字手速工坊：一串交替的基础珠与位移砝码通过小齿轮，把每个基础珠后的空位变成向前移动后的新形状；座位令牌堆成最小堆，顶部出口总取出最小令牌，归还令牌重新落回堆中；乱序石块先排好，再被压成从低到高且相邻最多升一级的台阶，末端达到可能的最高石块；房间钥匙按尺寸从大到小通过门槛加入有序候选架，每个查询夹具在满足最小尺寸后从偏好位置左右比较最近钥匙。禁止人物、字符、字母、数字、公式、代码、可读文字、箭头、座位或房间品牌、假界面、商标或水印。
