context: >-
  作者与三位同伴利用三天假期从比利时乘大巴去巴黎，在预算、疲惫与高密度行程之间游览城市、博物馆、塞纳河与凡尔赛宫，并从历史、艺术和日常体验中感受到法国的文化自信。正文实拍继续承担地点与人物记录。
