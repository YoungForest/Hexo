context: >-
  作者在寒冷的国庆假期跟团去丰宁坝上草原，第一次骑马便被带上四小时长线，在壮阔秋景、刺骨寒风、身体酸痛和额外花费之间完成一段既好笑又难忘的两日旅行。正文骑马实拍继续承担事实记录。
