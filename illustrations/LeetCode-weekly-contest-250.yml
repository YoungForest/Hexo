    composition: >-
      不使用 Forest。设计一座宽幅算法维修站：左侧无字符键盘有几枚断裂键，成组的空白词块只有完全避开坏键对应颜色才能通过筛门；中左梯子在跨度过大处由机械装置一次批量补入所有缺失横档；中右积分网格每行由从左和从右扫来的两束光维护最佳前缀与后缀，从而避免逐格两两比较；右侧家族树遍历时把当前根到节点的令牌加入二叉分拣树，查询晶石选择相反分支获得最大差异，离开节点时令牌退出。禁止字符、字母、数字、键帽文字、公式、代码、可读文字、商标或水印。
