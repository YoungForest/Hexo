      不使用 Forest。把头文件搜索画成图书馆隐喻：左侧编译器拥有按顺序排列的多个无标签书架，其中一册伞形总目录藏在较深的架位；右侧编辑器的小型机械信使起初在错误书架前被一条红色波浪虫阻挡。接入一条连接所有真实书架顺序的青绿色索引带后，信使准确找到伞形目录，红色波浪虫灰溜溜离开。不要出现真实编辑器界面、应用图标、C++ 标志、文件名、代码、路径、文字、字母、数字、商标或水印。
